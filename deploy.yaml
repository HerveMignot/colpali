apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: colpali-engine
spec:
  template:
    spec:
      containers:
        - image: gcr.io/your-project-id/colpali-engine
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: "4Gi"
